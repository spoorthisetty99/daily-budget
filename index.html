<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b17" />
  <title>Daily Budget</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <!-- iPhone "Add to Home Screen": own icon, full-screen, dark status bar -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- bump ?v= on each change so phones on the Wi-Fi link don't keep a stale copy -->
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">Where did my money <span class="accent">go?</span></h1>
    </header>

    <main id="view"></main>

    <button id="fab" class="fab" aria-label="Add spend">+</button>

    <nav class="tabs" role="tablist">
      <button data-tab="today" class="tab active">Today</button>
      <button data-tab="month" class="tab">Month</button>
      <button data-tab="insights" class="tab">Insights</button>
      <button data-tab="settings" class="tab">Settings</button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=8"></script>
</body>
</html>
